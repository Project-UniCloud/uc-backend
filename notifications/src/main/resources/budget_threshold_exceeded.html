<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:ital,wght@0,400;0,700" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Poppins:ital,wght@0,400;0,600" rel="stylesheet"/>
    <title>Budget Threshold Exceeded</title>
    <style> html, body {
        margin: 0 !important;
        padding: 0 !important;
        min-height: 100% !important;
        width: 100% !important;
        -webkit-font-smoothing: antialiased;
    }

    * {
        -ms-text-size-adjust: 100%;
    }

    #outlook a {
        padding: 0;
    }

    .ReadMsgBody, .ExternalClass {
        width: 100%;
    }

    .ExternalClass, .ExternalClass p, .ExternalClass td, .ExternalClass div, .ExternalClass span, .ExternalClass font {
        line-height: 100%;
    }

    table, td, th {
        mso-table-lspace: 0 !important;
        mso-table-rspace: 0 !important;
        border-collapse: collapse;
    }

    body, td, th, p, div, li, a, span {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        mso-line-height-rule: exactly;
    }

    img {
        border: 0;
        outline: 0;
        line-height: 100%;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
    }

    a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
    }

    @media (max-width: 620px) {
        .pc-project-container, .pc-component {
            width: 100% !important;
        }
        .pc-w620-padding-30-30-30-30 {
            padding: 30px 30px 30px 30px !important;
        }
        .pc-w620-font-size-32px {
            font-size: 32px !important;
        }
    }
    </style>
</head>
<body style="width: 100% !important; min-height: 100% !important; margin: 0 !important; padding: 0 !important; font-weight: normal; color: #2D3A41; background-color: #ffffff;" bgcolor="#ffffff">
<table style="table-layout: fixed; width: 100%; min-width: 600px; background-color: #ffffff;" bgcolor="#ffffff" border="0" cellspacing="0" cellpadding="0" role="presentation">
    <tr>
        <td align="center" valign="top">
            <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width: 600px;">
                <tr>
                    <td style="padding: 20px 0px 20px 0px;" align="left" valign="top">
                        <!-- Header -->
                        <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" align="center">
                            <tr>
                                <td align="center" style="padding: 24px 40px; background-color: #f8f9fd; border-radius: 23px 23px 0px 0px;">
                                    <h1 style="font-family: 'Montserrat', Arial, Helvetica, sans-serif; font-size: 32px; color: #2d2d2f; text-transform: uppercase; margin: 0;">Budget Alert</h1>
                                    <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f; margin: 10px 0 0 0;">Threshold level {notificationLevel} has been exceeded</p>
                                </td>
                            </tr>
                        </table>
                        <!-- Content -->
                        <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" align="center" style="background-color: #f8f9fd; padding: 32px 16px;">
                            <tr>
                                <td align="center">
                                    <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" style="border-collapse: separate; border-spacing: 0;">
                                        <tr>
                                            <td align="center" style="padding: 16px; border-bottom: 1px solid #d6d6d6;">
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f; margin: 0;">Cloud Resource Access ID</p>
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; color: #4a30cf; margin: 5px 0 0 0;">{cloudResourceAccessId}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td align="center" style="padding: 16px; border-bottom: 1px solid #d6d6d6;">
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f; margin: 0;">Current Cost</p>
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; color: #4a30cf; margin: 5px 0 0 0;">{currentCost} {currency}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td align="center" style="padding: 16px; border-bottom: 1px solid #d6d6d6;">
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f; margin: 0;">Budget Limit</p>
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; color: #4a30cf; margin: 5px 0 0 0;">{costLimit} {currency}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td align="center" style="padding: 16px;">
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f; margin: 0;">Occurred At</p>
                                                <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; color: #4a30cf; margin: 5px 0 0 0;">{occurredAt}</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                        <!-- Footer -->
                        <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" align="center" style="background-color: #f8f9fd; border-radius: 0px 0px 24px 24px; padding: 24px;">
                            <tr>
                                <td align="center">
                                    <p style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 14px; color: #2d2d2f;">&copy; Unicloud 2025</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
