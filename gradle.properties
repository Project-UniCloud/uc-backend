# Gradle build performance and JVM memory settings
# Increase the maximum heap size for the Gradle daemon to reduce OutOfMemoryError during builds/tests.
# Adjust Xmx to fit your machine/CI memory budget (e.g., 2g, 4g, 6g). 4g is a safe default for medium projects.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./java_pid%p.hprof

# Enable performance optimizations
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Kotlin incremental compilation (if applicable)
kotlin.incremental=true


# Auto-download matching JDKs for the configured toolchain
org.gradle.java.installations.auto-download=true
