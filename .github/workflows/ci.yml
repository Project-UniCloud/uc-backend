name: CI/CD

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  set-pr-title:
    name: Set PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Set PR Title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          CURRENT_TITLE="${{ github.event.pull_request.title }}"
          BRANCH_NAME="${{ github.head_ref }}"
          JIRA_TICKET=$(echo "$BRANCH_NAME" | grep -o 'UC-[0-9]\+')
          if [ -z "$JIRA_TICKET" ]; then
            echo "No UC ticket found in branch name. Skipping PR title update."
            exit 0
          fi
          NEW_TITLE="${JIRA_TICKET} ${CURRENT_TITLE} #${PR_NUMBER}"
          echo "Updating PR #$PR_NUMBER to title: $NEW_TITLE"
          gh pr edit $PR_NUMBER --title "$NEW_TITLE"

  ci:
    name: CI (Build & Test)
    runs-on: ubuntu-latest
    needs: set-pr-title
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set Gradle permissions
        run: chmod +x ./gradlew

      - name: Build + Test + JaCoCo
        run: ./gradlew clean build jacocoRootReport

  release:
    name: Release (Docker Build & Push)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/${OWNER_LOWER}/uc-backend:latest
          docker build -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}

  deploy:
    name: Deploy (Restart Application)
    runs-on: self-hosted
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Restart application
        run: |
          cd /ścieżka/do/aplikacji
          docker-compose pull
          docker-compose up -d
