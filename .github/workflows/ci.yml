name: CI/CD

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  ci:
    name: CI (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set Gradle permissions
        run: chmod +x ./gradlew

      - name: Build + Test + JaCoCo
        run: ./gradlew clean build jacocoRootReport

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build and analyze (PR)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./gradlew build

      - name: Build and analyze (Push)
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew build

  release:
    name: Release (Docker Build & Push)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/uc-backend:latest"
          docker build -t "$IMAGE_NAME" .
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: docker push "${{ env.IMAGE_NAME }}"

  deploy:
    name: Deploy (Restart Application)
    runs-on: self-hosted
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger restart webhook
        env:
          RESTART_SECRET: ${{ secrets.RESTART_SECRET }}
        run: |
          curl -X GET "https://unicloud.projektstudencki.pl/restart-webhook/uc-backend" \
            -H "Authorization: Bearer $RESTART_SECRET"
